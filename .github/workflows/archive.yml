name: archive

on:
  schedule:
    - cron: "20 2 * * *" # 每天 10:20（北京时间），跟在公开仓库 9 点的采集之后
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取回公开仓库当日热榜
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/Zfeng08/work-buddy/main/data/trends.json \
            -o /tmp/trends.json

      - name: 归档快照并更新历史
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          t = json.load(open('/tmp/trends.json', encoding='utf-8'))
          day = t.get('date') or datetime.date.today().isoformat()
          pathlib.Path('snapshots').mkdir(exist_ok=True)
          pathlib.Path(f'snapshots/{day}.json').write_text(
              json.dumps(t, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          hist = pathlib.Path('history.json')
          days = json.loads(hist.read_text(encoding='utf-8'))['days'] if hist.exists() else []
          days = [d for d in days if d.get('date') != day]
          days.append({'date': day, 'repos': [
              {'full_name': r['full_name'], 'stars': r['stars'],
               'stars_today': r['stars_today'], 'language': r.get('language', ''),
               'description_zh': r.get('description_zh', '')}
              for r in t.get('repos', [])]})
          days.sort(key=lambda d: d['date'])
          days = days[-365:]
          hist.write_text(json.dumps({'days': days}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('archived', day, '|', len(days), 'days')
          PY

      - name: 提交
        run: |
          git config user.name "work-buddy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 归档 $(date -u +%F) 热榜快照" || echo "no changes"
          git push
